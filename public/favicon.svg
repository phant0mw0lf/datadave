<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
	<style>
		.ink { stroke: #1F2328; }
		.d0 { fill: #1A7F37; }
		.d1 { fill: #8250DF; }
		.d2 { fill: #0969DA; }
		.ring { stroke: #0969DA; }
		@media (prefers-color-scheme: dark) {
			.ink { stroke: #E6EDF3; }
