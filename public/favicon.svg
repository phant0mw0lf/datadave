	</style>
	<line x1="10" y1="55" x2="90" y2="55" class="ink" stroke-width="6" stroke-linecap="round" />
	<circle cx="24" cy="55" r="7" class="d0" />
	<circle cx="55" cy="55" r="11" class="d1" />
	<circle cx="84" cy="55" r="23" class="ring" fill="none" stroke-width="3.5" stroke-opacity="0.45" />
	<circle cx="84" cy="55" r="15" class="d2" />
